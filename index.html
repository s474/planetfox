<script>
    const rand = (min, max) => Math.floor(Math.random() * (max - min + 1)) + min;
    const randF = (min, max) => Math.random() * (max - min) + min;
    const sign  = () => Math.random() < 0.5 ? 1 : -1;

    function makeBouncer(el) {
        let x = rand(0, window.innerWidth  - 100);
        let y = rand(0, window.innerHeight - 100);
        let vx = randF(1.5, 4) * sign();
        let vy = randF(1.5, 4) * sign();
        function step() {
            const w = window.innerWidth;
            const h = window.innerHeight;
            const pw = el.offsetWidth;
            const ph = el.offsetHeight;
            x += vx; y += vy;
            if (x <= 0 || x + pw >= w) vx = -vx;
            if (y <= 0 || y + ph >= h) vy = -vy;
            el.style.left = x + "px";
            el.style.top  = y + "px";
            requestAnimationFrame(step);
        }
        step();
    }

    const bouncers = Array.from(document.querySelectorAll('.bouncer'));

    function randomize() {
        document.body.style.backgroundSize = rand(64, 1200) + "px";
        bouncers.forEach(el => el.style.width = rand(62, 400) + "px");
    }

    randomize();
    setInterval(randomize, 66);

    // Start bouncing after images have a size
    window.addEventListener('load', () => bouncers.forEach(makeBouncer));
</script>

<div class="player">

</div>
