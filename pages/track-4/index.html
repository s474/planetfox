<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Planet Fox — Track 4</title>
<link rel="stylesheet" href="../_base.css">
<style>
    /* Scene 2: pulsing colour wash + drifting title */
    @keyframes pulse-bg {
        0%   { background: #1a003a; }
        25%  { background: #003a1a; }
        50%  { background: #3a001a; }
        75%  { background: #00183a; }
        100% { background: #1a003a; }
    }

    @keyframes drift {
        0%   { transform: translate(-50%, -50%) scale(1)    rotate(-2deg); }
        50%  { transform: translate(-50%, -54%) scale(1.08) rotate(2deg);  }
        100% { transform: translate(-50%, -50%) scale(1)    rotate(-2deg); }
    }

    #pf-pulse {
        position: fixed;
        inset: 0;
        animation: pulse-bg 6s ease-in-out infinite;
        display: flex;
        align-items: center;
        justify-content: center;
    }

    #pf-pulse span {
        position: absolute;
        top: 50%; left: 50%;
        font-size: clamp(3rem, 12vw, 9rem);
        font-weight: 900;
        letter-spacing: 0.15em;
        color: rgba(255,255,255,0.12);
        text-transform: uppercase;
        white-space: nowrap;
        animation: drift 8s ease-in-out infinite;
        user-select: none;
    }
</style>
</head>
<body>
<script type="module">
    import { init }   from '../_base.js';
    import { scenes } from './scenes.js';

    const TRACK_ID = 4;
    const API      = '../../player/api/tracks.php';
    const STREAM   = `../../player/api/stream.php?id=${TRACK_ID}`;

    const res   = await fetch(`${API}?action=play&id=${TRACK_ID}`);
    const track = await res.json();

    init(scenes, {
        audioSrc:    STREAM,
        bpm:         track.bpm,
        beat_offset: track.beat_offset,
    });
</script>
</body>
</html>
